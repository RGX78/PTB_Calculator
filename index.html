<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bakery Calculator</title>
    
    <!-- Manifest PWA w locie (wymagany do pełnego działania aplikacji na telefonie) -->
    <link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiQmFrZXJ5IENhbGN1bGF0b3IiLCJzaG9ydF9uYW1lIjoiQmFrZXJ5IENhbGMiLCJzdGFydF91cmwiOiIuLyIsImRpc3BsYXkiOiJzdGFuZGFsb25lIiwiYmFja2dyb3VuZF9jb2xvciI6IiNmM2Y0ZjYiLCJ0aGVtZV9jb2xvciI6IiMyNTYzZWIifQ==">
    
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bakery Calc">
    
    <!-- Skrypty do obsługi Reacta w przeglądarce -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS (Do stylizacji) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Proste style i animacje */
        body { margin: 0; padding: 0; background-color: #f3f4f6; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        /* Ukrywanie strzałek w polach number */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
        input[type="number"] { -moz-appearance: textfield; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // REJESTRACJA SERVICE WORKERA (Tarcza zapewniająca działanie Offline)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Tryb Offline Aktywny i zainstalowany!'))
                    .catch(err => console.log('Błąd trybu offline', err));
            });
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Bezpieczne renderowanie ikon Lucide w React bez konfliktów z DOM
        const Icon = ({ name, className }) => {
            const ref = React.useRef(null);
            React.useEffect(() => {
                if (ref.current && window.lucide) {
                    ref.current.innerHTML = `<i data-lucide="${name}" class="${className || ''}"></i>`;
                    window.lucide.createIcons({ root: ref.current });
                }
            }, [name, className]);
            return <span ref={ref} className="inline-flex items-center justify-center" />;
        };
        
        const Settings = (props) => <Icon name="settings" {...props} />;
        const Plus = (props) => <Icon name="plus" {...props} />;
        const Minus = (props) => <Icon name="minus" {...props} />;
        const CheckCircle2 = (props) => <Icon name="check-circle-2" {...props} />;
        const AlertCircle = (props) => <Icon name="alert-circle" {...props} />;
        const ShoppingCart = (props) => <Icon name="shopping-cart" {...props} />;
        const List = (props) => <Icon name="list" {...props} />;
        const Scale = (props) => <Icon name="scale" {...props} />;
        const Package = (props) => <Icon name="package" {...props} />;
        const Circle = (props) => <Icon name="circle" {...props} />;
        const ChevronUp = (props) => <Icon name="chevron-up" {...props} />;
        const ChevronDown = (props) => <Icon name="chevron-down" {...props} />;

        const App = () => {
            const [bapsOrder, setBapsOrder] = useState('');
            const [rollsOrder, setRollsOrder] = useState('');
            const [mixers, setMixers] = useState([]); // [{type: 'FULL', capacity: 975}, ...]
            const [autoMode, setAutoMode] = useState(true);
            
            const [checkedBapsTrolleys, setCheckedBapsTrolleys] = useState([]);
            const [checkedRollsTrolleys, setCheckedRollsTrolleys] = useState([]);
            const trolleyCap = 15;
            
            const [bapsOverrides, setBapsOverrides] = useState({});
            const [rollsOverrides, setRollsOverrides] = useState({});
            
            const [bapsTotalOffset, setBapsTotalOffset] = useState(0);
            const [rollsTotalOffset, setRollsTotalOffset] = useState(0);

            const FULL_CAPACITY = 975;
            const SMALL_CAPACITY = 650;
            const MAX_BUFFER = 150;
            const BAPS_WEIGHT = 0.090;
            const ROLLS_WEIGHT = 0.095;

            useEffect(() => {
                if (!autoMode) return;

                const total = (Number(bapsOrder) || 0) + (Number(rollsOrder) || 0);
                if (total === 0) {
                    setFullMixers(0);
                    setSmallMixers(0);
                    return;
                }

                let bestConfig = { full: 0, small: 0, buffer: Infinity };
                let fallbackConfig = { full: 0, small: 0, buffer: Infinity };
                let minAbs = Infinity;

                for (let f = 0; f <= 15; f++) {
                    for (let s = 0; s <= 3; s++) {
                        const prod = f * FULL_CAPACITY + s * SMALL_CAPACITY;
                        const buffer = prod - total;
                        
                        if (buffer >= 0 && buffer <= MAX_BUFFER && buffer < bestConfig.buffer) {
                            bestConfig = { full: f, small: s, buffer: buffer };
                        }

                        if (Math.abs(buffer) < minAbs) {
                            minAbs = Math.abs(buffer);
                            fallbackConfig = { full: f, small: s, buffer: buffer };
                        }
                    }
                }

                const newMixers = [];
                if (bestConfig.buffer !== Infinity) {
                    for(let i=0; i<bestConfig.full; i++) newMixers.push({type: 'FULL', capacity: FULL_CAPACITY});
                    for(let i=0; i<bestConfig.small; i++) newMixers.push({type: 'SMALL (2/3)', capacity: SMALL_CAPACITY});
                } else {
                    for(let i=0; i<fallbackConfig.full; i++) newMixers.push({type: 'FULL', capacity: FULL_CAPACITY});
                    for(let i=0; i<fallbackConfig.small; i++) newMixers.push({type: 'SMALL (2/3)', capacity: SMALL_CAPACITY});
                }
                setMixers(newMixers);
            }, [bapsOrder, rollsOrder, autoMode]);

            const handleManualChange = (type, operation) => {
                setAutoMode(false);
                setMixers(prev => {
                    if (operation === 'add') {
                        return [...prev, { 
                            type: type === 'full' ? 'FULL' : 'SMALL (2/3)', 
                            capacity: type === 'full' ? FULL_CAPACITY : SMALL_CAPACITY 
                        }];
                    } else {
                        const idx = [...prev].reverse().findIndex(m => (type === 'full' ? m.capacity === FULL_CAPACITY : m.capacity === SMALL_CAPACITY));
                        if (idx === -1) return prev;
                        const newArr = [...prev];
                        newArr.splice(prev.length - 1 - idx, 1);
                        return newArr;
                    }
                });
            };

            const moveMixer = (index, direction) => {
                setAutoMode(false);
                setMixers(prev => {
                    const newArr = [...prev];
                    const targetIdx = direction === 'up' ? index - 1 : index + 1;
                    if (targetIdx < 0 || targetIdx >= newArr.length) return prev;
                    [newArr[index], newArr[targetIdx]] = [newArr[targetIdx], newArr[index]];
                    return newArr;
                });
            };

            const totalOrder = (Number(bapsOrder) || 0) + (Number(rollsOrder) || 0);
            const totalProduction = mixers.reduce((sum, m) => sum + m.capacity, 0);
            const buffer = totalProduction - totalOrder;
            
            const bapsBuffer = Math.floor(buffer / 2);
            const rollsBuffer = Math.ceil(buffer / 2);
            
            const bapsTarget = (Number(bapsOrder) || 0) + bapsBuffer;
            const rollsTarget = (Number(rollsOrder) || 0) + rollsBuffer;

            useEffect(() => {
                setCheckedBapsTrolleys([]);
                setCheckedRollsTrolleys([]);
                setBapsOverrides({});
                setRollsOverrides({});
                setBapsTotalOffset(0);
                setRollsTotalOffset(0);
            }, [bapsTarget, rollsTarget]);

            const generateSchedule = () => {
                let schedule = [];
                let bapsRemaining = bapsTarget;
                let splitInfo = null;

                mixers.forEach((m) => {
                    let bapsInMixer = 0;
                    let rollsInMixer = 0;
                    const cap = m.capacity;

                    if (bapsRemaining >= cap) {
                        bapsInMixer = cap;
                        bapsRemaining -= cap;
                    } else if (bapsRemaining > 0) {
                        bapsInMixer = bapsRemaining;
                        rollsInMixer = cap - bapsRemaining;
                        splitInfo = { 
                            mixerNum: schedule.length + 1, 
                            bapsAmount: bapsInMixer, 
                            weight: (bapsInMixer * BAPS_WEIGHT).toFixed(2),
                            rollsAmount: rollsInMixer,
                            remainingWeight: (rollsInMixer * ROLLS_WEIGHT).toFixed(2)
                        };
                        bapsRemaining = 0;
                    } else {
                        rollsInMixer = cap;
                    }

                    schedule.push({
                        type: m.type,
                        capacity: cap,
                        baps: bapsInMixer,
                        rolls: rollsInMixer
                    });
                });

                return { schedule, splitInfo };
            };

            const { schedule, splitInfo } = generateSchedule();

            const calcTrays = (amount) => {
                const fullTrays = Math.floor(amount / 24);
                const remainder = amount % 24;
                return { fullTrays, remainder, totalTrays: fullTrays + (remainder > 0 ? 1 : 0) };
            };

            const bapsTrays = calcTrays(bapsTarget);
            const rollsTrays = calcTrays(rollsTarget);

            const toggleTrolley = (type, idx) => {
                if (type === 'baps') {
                    setCheckedBapsTrolleys(prev => {
                        const newArr = [...prev];
                        newArr[idx] = !newArr[idx];
                        return newArr;
                    });
                } else {
                    setCheckedRollsTrolleys(prev => {
                        const newArr = [...prev];
                        newArr[idx] = !newArr[idx];
                        return newArr;
                    });
                }
            };

            const handleOverride = (type, idx, newValue, isLast, currentValue) => {
                if (newValue < 1) return;

                const diff = newValue - currentValue;

                if (isLast) {
                    if (type === 'baps') {
                        setBapsTotalOffset(prev => prev + diff);
                    } else {
                        setRollsTotalOffset(prev => prev + diff);
                    }
                } else {
                    if (type === 'baps') {
                        setBapsOverrides(prev => ({...prev, [idx]: newValue}));
                    } else {
                        setRollsOverrides(prev => ({...prev, [idx]: newValue}));
                    }
                }
            };

            const getTrolleyDistribution = (effectiveTotal, defaultCap, overrides) => {
                let remaining = effectiveTotal;
                let result = [];
                let i = 0;
                
                while (remaining > 0 || overrides[i] !== undefined) {
                    let cap;
                    if (overrides[i] !== undefined) {
                        cap = overrides[i]; 
                    } else {
                        cap = remaining > defaultCap ? defaultCap : remaining;
                    }
                    
                    if (cap < 1 && remaining > 0) cap = 1;
                    
                    if (cap > 0) {
                        result.push(cap);
                        remaining -= cap;
                    }
                    i++;
                    if (i > 150) break;
                }
                return result;
            };

            const effectiveBapsTotal = Math.max(1, bapsTrays.totalTrays + bapsTotalOffset);
            const bapsDistribution = getTrolleyDistribution(effectiveBapsTotal, trolleyCap, bapsOverrides);
            const bapsActualTrays = bapsDistribution.reduce((sum, val) => sum + val, 0);
            const bapsActualPieces = bapsTarget + ((bapsActualTrays - bapsTrays.totalTrays) * 24);

            const effectiveRollsTotal = Math.max(1, rollsTrays.totalTrays + rollsTotalOffset);
            const rollsDistribution = getTrolleyDistribution(effectiveRollsTotal, trolleyCap, rollsOverrides);
            const rollsActualTrays = rollsDistribution.reduce((sum, val) => sum + val, 0);
            const rollsActualPieces = rollsTarget + ((rollsActualTrays - rollsTrays.totalTrays) * 24);

            const bapsCompletedTrays = bapsDistribution.reduce((sum, val, idx) => sum + (checkedBapsTrolleys[idx] ? val : 0), 0);
            const bapsCompletedPieces = (bapsCompletedTrays === bapsActualTrays && bapsActualTrays > 0) ? bapsActualPieces : (bapsCompletedTrays * 24);

            const rollsCompletedTrays = rollsDistribution.reduce((sum, val, idx) => sum + (checkedRollsTrolleys[idx] ? val : 0), 0);
            const rollsCompletedPieces = (rollsCompletedTrays === rollsActualTrays && rollsActualTrays > 0) ? rollsActualPieces : (rollsCompletedTrays * 24);

            const renderTrolleys = (distribution, checkedState, toggleType) => {
                if (distribution.length === 0) return null;
                
                return (
                    <div className="flex flex-wrap gap-2 mt-1">
                        {distribution.map((trays, idx) => {
                            const isChecked = checkedState[idx] || false;
                            const isLast = idx === distribution.length - 1;
                            
                            return (
                                <div key={idx} className={`flex items-center rounded-xl border-2 transition-all duration-200 ${isChecked ? 'border-green-400 bg-green-50 shadow-sm' : 'border-gray-200 bg-white hover:border-blue-300'}`}>
                                
                                {isChecked && (
                                    <button 
                                    onClick={(e) => { e.stopPropagation(); handleOverride(toggleType, idx, trays - 1, isLast, trays); }} 
                                    className="w-8 h-12 flex items-center justify-center text-green-700 hover:bg-green-100 font-bold rounded-l-lg border-r border-green-200"
                                    >
                                    <Minus className="w-4 h-4" />
                                    </button>
                                )}

                                <button
                                    onClick={() => toggleTrolley(toggleType, idx)}
                                    className={`flex flex-col items-center justify-center h-12 transition-all ${!isChecked ? 'w-14 rounded-xl' : 'w-10'}`}
                                >
                                    <span className={`text-[12px] font-bold ${isChecked ? 'text-green-800' : 'text-gray-500'}`}>{trays}tr</span>
                                    {isChecked ? <CheckCircle2 className="w-4 h-4 text-green-500 mt-0.5" /> : <Circle className="w-4 h-4 text-gray-300 mt-0.5" />}
                                </button>

                                {isChecked && (
                                    <button 
                                    onClick={(e) => { e.stopPropagation(); handleOverride(toggleType, idx, trays + 1, isLast, trays); }} 
                                    className="w-8 h-12 flex items-center justify-center text-green-700 hover:bg-green-100 font-bold rounded-r-lg border-l border-green-200"
                                    >
                                    <Plus className="w-4 h-4" />
                                    </button>
                                )}
                                </div>
                            );
                        })}
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-gray-100 flex justify-center font-sans text-gray-800">
                    <div className="w-full max-w-md bg-white shadow-xl min-h-screen relative overflow-y-auto pb-20">
                        
                        <div className="bg-blue-600 text-white p-5 rounded-b-3xl shadow-md sticky top-0 z-10">
                            <h1 className="text-xl font-bold flex items-center gap-2">
                                <Settings className="w-6 h-6" />
                                Bakery Calculator
                            </h1>
                            <p className="text-blue-100 text-sm mt-1">Calculating Baps & Rolls</p>
                        </div>

                        <div className="p-5 space-y-6">
                        
                        <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 space-y-4">
                            <h2 className="font-semibold text-gray-700 flex items-center gap-2">
                                <ShoppingCart className="w-5 h-5 text-blue-500" />
                                Order
                            </h2>
                            <div className="flex gap-4">
                                <div className="flex-1">
                                    <label className="block text-xs font-medium text-gray-500 mb-1">Baps</label>
                                    <input 
                                    type="number" 
                                    value={bapsOrder}
                                    onChange={(e) => setBapsOrder(e.target.value)}
                                    className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    placeholder="0"
                                    />
                                </div>
                                <div className="flex-1">
                                    <label className="block text-xs font-medium text-gray-500 mb-1">Rolls</label>
                                    <input 
                                    type="number" 
                                    value={rollsOrder}
                                    onChange={(e) => setRollsOrder(e.target.value)}
                                    className="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    placeholder="0"
                                    />
                                </div>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 space-y-4">
                            <div className="flex justify-between items-center">
                                <h2 className="font-semibold text-gray-700">Mixers</h2>
                                <button 
                                    onClick={() => setAutoMode(true)}
                                    className={`text-xs px-3 py-1 rounded-full font-medium transition-colors ${autoMode ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-500'}`}
                                >
                                    {autoMode ? 'Auto ON' : 'Auto OFF'}
                                </button>
                            </div>
                            
                            <div className="flex justify-between items-center bg-gray-50 p-3 rounded-xl">
                                <div>
                                    <p className="font-medium">Full mixers</p>
                                    <p className="text-xs text-gray-400">975 pcs</p>
                                </div>
                                <div className="flex items-center gap-3">
                                    <button onClick={() => handleManualChange('full', 'subtract')} className="bg-white p-2 rounded-lg shadow-sm border border-gray-200"><Minus className="w-4 h-4" /></button>
                                    <span className="w-6 text-center font-bold text-lg">{mixers.filter(m => m.capacity === FULL_CAPACITY).length}</span>
                                    <button onClick={() => handleManualChange('full', 'add')} className="bg-white p-2 rounded-lg shadow-sm border border-gray-200"><Plus className="w-4 h-4" /></button>
                                </div>
                            </div>

                            <div className="flex justify-between items-center bg-gray-50 p-3 rounded-xl">
                                <div>
                                    <p className="font-medium">Small mixers</p>
                                    <p className="text-xs text-gray-400">650 pcs</p>
                                </div>
                                <div className="flex items-center gap-3">
                                    <button onClick={() => handleManualChange('small', 'subtract')} className="bg-white p-2 rounded-lg shadow-sm border border-gray-200"><Minus className="w-4 h-4" /></button>
                                    <span className="w-6 text-center font-bold text-lg">{mixers.filter(m => m.capacity === SMALL_CAPACITY).length}</span>
                                    <button onClick={() => handleManualChange('small', 'add')} className="bg-white p-2 rounded-lg shadow-sm border border-gray-200"><Plus className="w-4 h-4" /></button>
                                </div>
                            </div>
                        </div>

                        {totalOrder > 0 && totalProduction > 0 && (
                            <div className="space-y-6 animate-fade-in-up">
                            
                            <div className={`p-4 rounded-2xl border ${buffer >= 0 ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`}>
                                <div className="flex items-center gap-2 mb-3">
                                    {buffer >= 0 ? <CheckCircle2 className="w-5 h-5 text-green-600" /> : <AlertCircle className="w-5 h-5 text-red-600" />}
                                    <h3 className={`font-bold ${buffer >= 0 ? 'text-green-800' : 'text-red-800'}`}>
                                        {buffer >= 0 ? `Surplus: ${buffer} pcs` : `Shortage: ${Math.abs(buffer)} pcs`}
                                    </h3>
                                </div>
                                
                                <div className="grid grid-cols-2 gap-2 mt-4">
                                    <div className="bg-white p-3 rounded-xl shadow-sm border border-black/5">
                                        <p className="text-xs text-gray-500 uppercase tracking-wider">Target Baps</p>
                                        <p className="text-xl font-bold">{bapsTarget}</p>
                                        <p className="text-xs text-gray-400 mt-1">{bapsOrder} {buffer >= 0 ? '+' : ''}{bapsBuffer}</p>
                                    </div>
                                    <div className="bg-white p-3 rounded-xl shadow-sm border border-black/5">
                                        <p className="text-xs text-gray-500 uppercase tracking-wider">Target Rolls</p>
                                        <p className="text-xl font-bold">{rollsTarget}</p>
                                        <p className="text-xs text-gray-400 mt-1">{rollsOrder} {buffer >= 0 ? '+' : ''}{rollsBuffer}</p>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                                <div className="p-4 border-b border-gray-100 bg-gray-50/50 flex items-center gap-2">
                                    <List className="w-5 h-5 text-blue-500" />
                                    <h2 className="font-semibold text-gray-700">Production Schedule</h2>
                                </div>
                                <div className="p-0">
                                    {schedule.map((mixer, idx) => {
                                        const isSplit = mixer.baps > 0 && mixer.rolls > 0;
                                        const isSmall = mixer.capacity === SMALL_CAPACITY;
                                        
                                        let rowBg = isSplit ? 'bg-red-50' : (isSmall ? 'bg-purple-50/50' : '');
                                        let circleColor = isSplit ? 'bg-red-200 text-red-800' : (isSmall ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700');
                                        let textColor = isSplit ? 'text-red-800' : (isSmall ? 'text-purple-800' : '');

                                        return (
                                            <div key={idx} className={`flex border-b border-gray-100 last:border-0 p-4 items-center transition-colors ${rowBg}`}>
                                                <div className={`w-12 h-12 rounded-full flex items-center justify-center font-bold mr-4 ${circleColor}`}>
                                                #{idx + 1}
                                                </div>
                                                <div className="flex-1">
                                                <div className="flex justify-between items-center">
                                                    <p className={`font-semibold text-sm ${textColor}`}>{mixer.type} ({mixer.capacity} pcs)</p>
                                                    <div className="flex gap-1">
                                                        <button 
                                                            onClick={() => moveMixer(idx, 'up')}
                                                            disabled={idx === 0}
                                                            className={`p-1 rounded bg-white border border-gray-200 shadow-sm ${idx === 0 ? 'opacity-30' : 'hover:bg-blue-50 text-blue-600'}`}
                                                        >
                                                            <ChevronUp className="w-4 h-4" />
                                                        </button>
                                                        <button 
                                                            onClick={() => moveMixer(idx, 'down')}
                                                            disabled={idx === schedule.length - 1}
                                                            className={`p-1 rounded bg-white border border-gray-200 shadow-sm ${idx === schedule.length - 1 ? 'opacity-30' : 'hover:bg-blue-50 text-blue-600'}`}
                                                        >
                                                            <ChevronDown className="w-4 h-4" />
                                                        </button>
                                                        {isSplit && <span className="text-[10px] bg-red-600 text-white px-2 py-0.5 rounded font-bold uppercase tracking-wider animate-pulse ml-1">Change!</span>}
                                                    </div>
                                                </div>
                                                <div className="flex gap-2 mt-1">
                                                    {mixer.baps > 0 && <span className="text-xs bg-amber-100 text-amber-800 px-2 py-1 rounded">Baps: {mixer.baps}</span>}
                                                    {mixer.rolls > 0 && <span className="text-xs bg-indigo-100 text-indigo-800 px-2 py-1 rounded">Rolls: {mixer.rolls}</span>}
                                                </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {splitInfo && (
                                <div className="bg-red-50 rounded-2xl border border-red-200 p-4 flex items-start gap-3 shadow-sm">
                                    <div className="mt-1"><Scale className="w-5 h-5 text-red-600" /></div>
                                    <div className="flex-1">
                                        <h3 className="font-bold text-red-900">Split in Mixer #{splitInfo.mixerNum}</h3>
                                        <div className="mt-3 grid grid-cols-2 gap-3">
                                            <div className="bg-white p-3 rounded-xl border border-red-100 shadow-sm text-center">
                                                <p className="text-xs text-red-800 font-medium">For Baps ({splitInfo.bapsAmount} pcs)</p>
                                                <p className="text-2xl font-black text-red-600 mt-1">{splitInfo.weight} kg</p>
                                            </div>
                                            <div className="bg-white p-3 rounded-xl border border-red-100 shadow-sm text-center">
                                                <p className="text-xs text-red-800 font-medium">Rest for Rolls ({splitInfo.rollsAmount} pcs)</p>
                                                <p className="text-2xl font-black text-red-600 mt-1">{splitInfo.remainingWeight} kg</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-4">
                                <div className="flex justify-between items-start mb-4">
                                    <h2 className="font-semibold text-gray-700 flex items-center gap-2">
                                        <Package className="w-5 h-5 text-blue-500" />
                                        Trolley Management
                                    </h2>
                                </div>

                                <div className="space-y-4">
                                
                                <div className="bg-gray-50 p-3 rounded-xl border border-gray-100">
                                    <div className="flex flex-wrap justify-between items-start mb-3 gap-2">
                                        <div>
                                            <span className="font-bold text-amber-700 block text-lg leading-tight">Baps Trolleys</span>
                                            <span className="text-[11px] text-gray-500">Target: {bapsTrays.totalTrays} trays</span>
                                        </div>
                                        <div className="flex gap-1.5 text-right justify-end flex-wrap">
                                            <div className="bg-white px-2 py-1 rounded-lg border border-gray-200 shadow-sm flex flex-col justify-center min-w-[55px] text-center">
                                                <span className="text-[9px] text-gray-400 font-bold uppercase block leading-tight">Order</span>
                                                <span className="font-bold text-base leading-none mt-1 text-gray-700">
                                                    {Number(bapsOrder) || 0} <span className="text-[10px] font-normal text-gray-500">pcs</span>
                                                </span>
                                            </div>
                                            <div className="bg-white px-2 py-1 rounded-lg border border-amber-100 shadow-sm flex flex-col justify-center min-w-[50px] text-center">
                                                <span className="text-[9px] text-gray-400 font-bold uppercase block leading-tight">Plan</span>
                                                <span className={`font-bold text-base leading-none mt-1 ${bapsActualTrays !== bapsTrays.totalTrays ? 'text-blue-600' : 'text-gray-700'}`}>
                                                    {bapsActualTrays} <span className="text-[10px] font-normal text-gray-500">tr.</span>
                                                </span>
                                            </div>
                                            <div className={`bg-white px-3 py-1.5 rounded-lg border shadow-sm min-w-[75px] text-center ${bapsCompletedTrays > 0 && bapsCompletedTrays === bapsActualTrays ? 'border-green-400 bg-green-50' : 'border-green-200'}`}>
                                                <span className="text-[10px] text-green-600 font-bold uppercase block leading-tight">Completed</span>
                                                <span className="font-black text-xl leading-none text-green-700 mt-1 block">
                                                    {bapsCompletedTrays} <span className="text-xs font-normal opacity-70 text-green-600">tr.</span>
                                                </span>
                                                <span className="block text-[11px] font-bold mt-0.5 text-green-600">
                                                    {bapsCompletedTrays === bapsActualTrays ? `${bapsCompletedPieces} pcs` : `~${bapsCompletedPieces} pcs`}
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                    {renderTrolleys(bapsDistribution, checkedBapsTrolleys, 'baps')}
                                </div>
                                
                                <div className="bg-gray-50 p-3 rounded-xl border border-gray-100">
                                    <div className="flex flex-wrap justify-between items-start mb-3 gap-2">
                                        <div>
                                            <span className="font-bold text-indigo-700 block text-lg leading-tight">Rolls Trolleys</span>
                                            <span className="text-[11px] text-gray-500">Target: {rollsTrays.totalTrays} trays</span>
                                        </div>
                                        <div className="flex gap-1.5 text-right justify-end flex-wrap">
                                            <div className="bg-white px-2 py-1 rounded-lg border border-gray-200 shadow-sm flex flex-col justify-center min-w-[55px] text-center">
                                                <span className="text-[9px] text-gray-400 font-bold uppercase block leading-tight">Order</span>
                                                <span className="font-bold text-base leading-none mt-1 text-gray-700">
                                                    {Number(rollsOrder) || 0} <span className="text-[10px] font-normal text-gray-500">pcs</span>
                                                </span>
                                            </div>
                                            <div className="bg-white px-2 py-1 rounded-lg border border-indigo-100 shadow-sm flex flex-col justify-center min-w-[50px] text-center">
                                                <span className="text-[9px] text-gray-400 font-bold uppercase block leading-tight">Plan</span>
                                                <span className={`font-bold text-base leading-none mt-1 ${rollsActualTrays !== rollsTrays.totalTrays ? 'text-blue-600' : 'text-gray-700'}`}>
                                                    {rollsActualTrays} <span className="text-[10px] font-normal text-gray-500">tr.</span>
                                                </span>
                                            </div>
                                            <div className={`bg-white px-3 py-1.5 rounded-lg border shadow-sm min-w-[75px] text-center ${rollsCompletedTrays > 0 && rollsCompletedTrays === rollsActualTrays ? 'border-green-400 bg-green-50' : 'border-green-200'}`}>
                                                <span className="text-[10px] text-green-600 font-bold uppercase block leading-tight">Completed</span>
                                                <span className="font-black text-xl leading-none text-green-700 mt-1 block">
                                                    {rollsCompletedTrays} <span className="text-xs font-normal opacity-70 text-green-600">tr.</span>
                                                </span>
                                                <span className="block text-[11px] font-bold mt-0.5 text-green-600">
                                                    {rollsCompletedTrays === rollsActualTrays ? `${rollsCompletedPieces} pcs` : `~${rollsCompletedPieces} pcs`}
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                    {renderTrolleys(rollsDistribution, checkedRollsTrolleys, 'rolls')}
                                </div>

                                </div>
                            </div>

                            </div>
                        )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
